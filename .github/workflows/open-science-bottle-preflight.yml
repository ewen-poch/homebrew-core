name: Open Science bottle preflight

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Linux bottle validation runner
        type: choice
        default: ubuntu-24.04-arm
        options: [ubuntu-24.04-arm, ubuntu-24.04]

permissions:
  contents: read

concurrency:
  group: open-science-bottle-${{ github.ref }}-${{ inputs.runner }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'ewen-poch/homebrew-core'
    runs-on: ${{ inputs.runner }}
    container:
      image: ghcr.io/homebrew/brew:main
      options: --init --user linuxbrew
    timeout-minutes: 60
    defaults:
      run:
        shell: /bin/bash -euo pipefail {0}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_FROM_API: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_BUILD_ERROR_ISSUES: '1'
      BOTTLES_DIR: ${{ github.workspace }}/bottles
    steps:
      - name: Set up Homebrew and check out this revision
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478
        with:
          core: true
          cask: false
      - name: Prepare the disposable runner
        run: |
          brew trust homebrew/core
          brew test-bot --only-setup
          mkdir -p "$BOTTLES_DIR"
      - name: Build, bottle, reinstall and verify the Formula
        working-directory: ${{ env.BOTTLES_DIR }}
        run: |
          brew test-bot --testing-formulae=open-science-cli \
            --added-formulae=open-science-cli --deleted-formulae= \
            --only-formulae --junit --only-json-tab --skip-dependents
      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$BOTTLES_DIR/logs"
          cp -R "$HOME/Library/Logs/Homebrew/open-science-cli" "$BOTTLES_DIR/logs/" || true
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: open-science-bottle-${{ inputs.runner }}
          path: |
            ${{ env.BOTTLES_DIR }}/**/*.txt
            ${{ env.BOTTLES_DIR }}/**/*.xml
            ${{ env.BOTTLES_DIR }}/**/*.json
            ${{ env.BOTTLES_DIR }}/logs/
          if-no-files-found: warn
